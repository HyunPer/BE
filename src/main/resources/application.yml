spring:
  application:
    name: pleos-backend
  datasource:
    # 로컬 개발용 파일 DB. 재시작해도 데이터가 남는다 (BE/data/ 아래, git 제외).
    url: jdbc:h2:file:./data/pleos;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      # 실제 제한은 pleos.files.max-bytes에서 한국어 오류로 응답한다. 여기는 그보다 넉넉하게 둔다.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # 로컬 8080·8081은 Docker Desktop이 사용 중이라 8090을 기본값으로 둔다. PORT 환경변수로 변경 가능.
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info

pleos:
  files:
    # 테마 이미지 저장 위치 (BE/data/ 아래, git 제외)
    dir: ./data/files
    max-bytes: 3145728 # 3MB
  qa:
    # 임시 QA 콘솔(/qa)과 데모 시드 API. 운영 배포에서는 false.
    enabled: true
